name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-check:
    name: Static site integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Vercel config
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"

      - name: Validate required site files
        run: |
          test -s index.html
          test -s styles.css
          test -s assets/hero.jpg
          test -s lords-army.html
          test -s lords-army-hero.jpg

      - name: Check for conflict markers
        run: |
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .
