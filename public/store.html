<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THELORDS.ARMY Store</title>
  <meta name="description" content="Premium tactical apparel and gear for THELORDS.ARMY. Built for the mission. Made for disciples.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./store.css">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#top">THELORDS.ARMY</a>
        <nav class="site-nav" aria-label="Primary" data-nav></nav>
        <button class="cart-button" type="button" aria-label="Cart placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="20" r="1"></circle>
            <circle cx="18" cy="20" r="1"></circle>
            <path d="M3 4h2l2.4 10.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H7"></path>
          </svg>
        </button>
      </div>
    </header>

    <main id="top">
      <div id="store-app"></div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-copy">
          <p class="brand">THELORDS.ARMY</p>
          <p class="footer-tagline">A movement. Not a brand.</p>
          <p>&copy; <span data-year></span> THELORDS.ARMY</p>
        </div>
        <nav class="footer-links" aria-label="Footer">
          <a href="#uniform">Uniform</a>
          <a href="#gear">Gear</a>
          <a href="#patches">Patches</a>
          <a href="#mission">Mission</a>
          <a href="mailto:contact@thelords.army">Contact</a>
        </nav>
      </div>
    </footer>
  </div>

  <script type="module" src="./store.js"></script>
</body>
</html>
